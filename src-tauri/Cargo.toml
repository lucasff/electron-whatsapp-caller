[package]
name = "whatsapp-caller"
version = "0.3.0"
description = "Open tel: and callto: links in WhatsApp"
authors = ["Lucas Freitas <lucas@lucasfreitas.me>"]
license = "MIT"
repository = "https://github.com/lucasff/electron-whatsapp-caller"
edition = "2021"

[lib]
name = "whatsapp_caller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"
ureq = { version = "3", features = ["json"] }
tungstenite = "0.30"
rlibphonenumber = { version = "2.2.14", default-features = false, features = ["global_static", "lite", "protox"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
